name: Bug report
description: Something in Clockwork doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: client
    attributes:
      label: Game
      options: [Retail, WoW Forever / Classic]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clockwork version
      placeholder: "e.g. 1.8.29 (shown in /cwk)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error text (BugSack / BugGrabber), if any
      render: text
  - type: textarea
    id: debug
    attributes:
      label: Debug report (optional)
      description: "Type /cwk debug, then /reload, and attach WTF/Account/<account>/SavedVariables/Clockwork.lua (check it first - it holds your Clockwork settings)."
